openapi: 3.0.3
info:
  title: League API
  version: 1.0.0
paths:
  /standings:
    get:
      operationId: getStandings
      summary: Get all team standings
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamStanding'

  /results:
    get:
      operationId: getResults
      summary: Get all finished match results
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchItem'

  /fixtures:
    get:
      operationId: getFixtures
      summary: Get all upcoming fixtures
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchItem'

  /results/{teamName}:
    get:
      operationId: getResultsByTeam
      summary: Get finished matches for a specific team
      parameters:
        - name: teamName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchItem'

  /fixtures/{teamName}:
    get:
      operationId: getFixturesByTeam
      summary: Get upcoming fixtures for a specific team
      parameters:
        - name: teamName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchItem'

components:
  schemas:
    TeamStanding:
      type: object
      required: [rank, teamName, matchesPlayed, points, wins, setsWon, setsLost, pointsWon, pointsLost, setsRatio, pointRatio]
      properties:
        rank:
          type: integer
        teamName:
          type: string
        matchesPlayed:
          type: integer
        points:
          type: integer
        wins:
          type: integer
        setsWon:
          type: integer
        setsLost:
          type: integer
        pointsWon:
          type: integer
        pointsLost:
          type: integer
        setsRatio:
          type: number
        pointRatio:
          type: number
        form:
          type: array
          items:
            type: string
            enum: [W, P]
          description: Last up to 5 match results ('W' for win, 'P' for loss), ordered from most recent to oldest.

    MatchItem:
      type: object
      required: [matchId, date, homeTeamName, awayTeamName, score, isFinished]
      properties:
        matchId:
          type: string
        date:
          type: string
          description: Local match date and time in `YYYY-MM-DD HH:mm` form.
        homeTeamName:
          type: string
        awayTeamName:
          type: string
        score:
          type: string
          description: Final score in sets (e.g. '3:1').
        finalScore:
          type: string
          description: Final score in sets (e.g. '3:1').
        isFinished:
          type: boolean
        place:
          type: string
          nullable: true
          description: Location / hall where match is played.
        hour:
          type: string
          nullable: true
          description: Match hour or status (e.g. '17:00' or 'zawiadamia gospodarz').
        sets:
          type: array
          items:
            type: string
          description: Points scores for each set played (e.g. ['25:16', '23:25', '25:20']).
