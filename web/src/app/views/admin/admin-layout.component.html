<div class="admin-shell">
  <header class="admin-navbar">
    <div class="admin-nav-container">
      <div class="nav-left">
        <a routerLink="/admin/aktualnosci" class="admin-brand">
          <span class="brand-badge">Admin</span>
          <span class="brand-title">United Środa Śląska</span>
        </a>

        <nav class="admin-links">
          <a
            routerLink="/admin/aktualnosci"
            routerLinkActive="is-active"
            class="admin-nav-link"
          >
            Aktualności
          </a>
        </nav>
      </div>

      <div class="nav-right">
        <a routerLink="/" target="_blank" class="view-site-link" title="Otwórz stronę klubu w nowej karcie">
          <span>Strona klubu</span>
          <svg viewBox="0 0 20 20" width="14" height="14" fill="currentColor">
            <path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z" />
            <path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z" />
          </svg>
        </a>

        <div class="user-info">
          <span class="user-email">{{ currentUser()?.email }}</span>
          <button type="button" class="logout-btn" (click)="logout()" title="Wyloguj się">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
              <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 001 1h6a1 1 0 100-2H4V5h5a1 1 0 100-2H3zm10.293 3.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L15.586 11H8a1 1 0 110-2h7.586l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
            <span>Wyloguj</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <router-outlet></router-outlet>
  </main>
</div>
